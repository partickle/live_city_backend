server:
  http_listen_port: 9080
  grpc_listen_port: 9095

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: django_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: django_logs
          __path__: /app/logs/app.log
